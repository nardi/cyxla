[project]
site_url = "https://nardi.github.io/cyxla/"
site_name = "cyxla"
site_description = "A bridge from JAX to native code through the PJRT C API"
site_author = "Nardi Lam"
repo_url = "https://github.com/nardi/cyxla"
repo_name = "nardi/cyxla"

nav = [
  { "Introduction" = "index.md" },
  { "Installation" = "installation.md" },
  { "Guide" = [
    { "Programs" = "guide/running.md" },
    { "Custom calls" = "guide/custom-calls.md" },
    { "Native functions" = "guide/native-functions.md" },
    { "Extension modules" = "guide/extensions.md" },
    { "Plugins" = "guide/plugins.md" },
    { "Cache and memory" = "guide/caching.md" },
    { "Serializing programs" = "guide/serialization.md" },
  ] },
  { "Design" = "design.md" },
  { "CPU plugin package" = "cpu-plugin.md" },
  { "API reference" = [
    { "Programs" = "api/programs.md" },
    { "Plugins and runtime" = "api/plugins.md" },
    { "Custom calls" = "api/custom-calls.md" },
    { "Disk cache" = "api/cache.md" },
    { "Serialization" = "api/serialization.md" },
    { "Extension modules" = "api/extension.md" },
  ] },
  { "Development" = "development.md" },
  { "References" = "references.md" },
]

[project.theme]
language = "en"
# The directory of the theme inside the submodule, which extends the built-in
# theme through its mkdocs_theme.yml.
custom_dir = "../zensical-tufte/zensical_tufte"
features = [
  "content.code.copy",
  "navigation.sections",
  "navigation.top",
  "search.highlight",
]

[project.plugins.mkdocstrings.handlers.python]
paths = ["src"]

[project.plugins.mkdocstrings.handlers.python.options]
docstring_style = "google"
show_source = false
filters = ["!^_", "!^wrap$"]
show_root_heading = true
show_root_full_path = false
heading_level = 2
members_order = "source"
merge_init_into_class = true
separate_signature = true
show_signature_annotations = true

# Zensical copies the files of the theme's package into the site, so they are excluded.
[project.plugins.exclude]
glob = ["mkdocs_theme.yml", "__init__.py", "__pycache__/*"]

# The switcher of the header, which links the sites of the other repositories.
[project.extra.site_switcher]
current = "cyxla"
