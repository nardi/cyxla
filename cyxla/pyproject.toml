[project]
name = "cyxla"
version = "0.1.0"
description = "A bridge from JAX to native code through the PJRT C API"
readme = "README.md"
authors = [{ name = "Nardi Lam", email = "mail@nardilam.nl" }]
license-files = ["LICENSE.md", "src/cyxla/include/xla/LICENSE"]
requires-python = ">=3.11"
dependencies = ["jax>=0.10", "numpy>=1.26"]

[project.optional-dependencies]
# Each extra installs the PJRT plugin of one platform. The GPU and TPU plugins are the
# ones that JAX publishes, and the CUDA extras also install the CUDA libraries.
cpu = ["cyxla-pjrt-cpu>=0.12"]
cuda12 = ["jax-cuda12-plugin[with-cuda]"]
cuda13 = ["jax-cuda13-plugin[with-cuda]"]
rocm7 = ["jax-rocm7-pjrt"]
tpu = ["libtpu"]

[project.urls]
Source = "https://github.com/nardi/cyxla/tree/main/cyxla"
Documentation = "https://nardi.github.io/cyxla/"

[build-system]
requires = ["meson-python>=0.18", "meson>=1.8", "cython>=3.1"]
build-backend = "mesonpy"

[tool.meson-python.args]
# CPython on Windows needs extension modules from MSVC, and the runners also have MinGW on
# the path, which Meson would pick otherwise. The option does nothing on other systems.
setup = ["--vsenv"]

[dependency-groups]
dev = [
    "markdown-pytest>=0.6.6",
    "pytest>=9.1.0",
    "pytest-cov>=7",
    "ruff>=0.15.17",
    "ty>=0.0.59",
]
# An editable meson-python install rebuilds the extension module on import, so the build
# tools have to live in the environment itself rather than in an isolated one. The test of
# a downstream extension module uses them as well.
build = ["meson-python>=0.18", "meson>=1.8", "ninja>=1.11", "cython>=3.1"]
# The CPU plugin, which the tests run programs on. Linting does without it.
plugin = ["cyxla-pjrt-cpu"]
# The documentation site. The API reference reads the source, so it needs no build.
docs = ["zensical>=0.0.73", "mkdocstrings-python>=2"]

[tool.uv]
default-groups = ["build", "dev", "plugin"]
no-build-isolation-package = ["cyxla"]
# Development builds trace lines in the Cython module, so its coverage is measured as well.
config-settings = { setup-args = "-Dcoverage=true" }

[tool.uv.sources]
cyxla-pjrt-cpu = { path = "../cyxla-pjrt-cpu" }

[tool.pytest.ini_options]
# The README and the documentation are collected by markdown-pytest, which runs code
# blocks marked with a `<!-- name: test_... -->` comment.
testpaths = ["tests", "README.md", "docs"]

[tool.coverage.run]
branch = true
source = ["cyxla"]
plugins = ["Cython.Coverage"]
# CI combines the data of Linux, macOS and Windows runners, whose checkouts live at
# different paths.
relative_files = true
# Tests of an uninitialized runtime run in subprocesses, which coverage measures too.
patch = ["subprocess"]

[tool.coverage.report]
fail_under = 100
show_missing = true
exclude_also = ["if TYPE_CHECKING:", "raise AssertionError", "@overload", "if __name__ == .__main__.:"]

[tool.ruff]
# Colab notebooks run outside the package and are not checked.
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.per-file-ignores]
# Names from `cython.cimports` are declared in `.pxd` files that ruff does not read.
"src/cyxla/_runtime.py" = ["F821"]
"tests/downstream/src/*.py" = ["F821"]

[tool.ty.src]
# The Cython modules are checked through their `.pyi` stubs.
exclude = ["src/cyxla/_runtime.py", "tests/downstream/src"]
