name: cyxla

on:
  push:
    branches: ["**"]
    paths:
      - "cyxla/**"
      - "cyxla-pjrt-cpu/**"
      - ".github/workflows/cyxla.yml"
      - ".github/actions/plugin-library/**"
    tags: ["cyxla-v*"]
  pull_request:
    paths:
      - "cyxla/**"
      - "cyxla-pjrt-cpu/**"
      - ".github/workflows/cyxla.yml"
      - ".github/actions/plugin-library/**"

# Reading the artifacts of the plugin workflow needs read access to Actions.
permissions:
  actions: read
  contents: read

defaults:
  run:
    shell: bash
    working-directory: cyxla

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install Python
        run: uv python install ${{ matrix.python-version }}

      # The development environment builds the plugin package from `../cyxla-pjrt-cpu`.
      - name: Get the plugin library
        uses: ./.github/actions/plugin-library

      - name: Sync dependencies
        run: uv sync --locked --python ${{ matrix.python-version }}

      - name: Run tests
        env:
          COVERAGE_FILE: .coverage.${{ matrix.os }}.${{ matrix.python-version }}
        run: uv run pytest --cov --cov-fail-under=0

      - name: Upload coverage data
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.os }}-${{ matrix.python-version }}
          path: cyxla/.coverage.*
          include-hidden-files: true

  coverage:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # Syncing builds the Cython module, and the coverage report reads its C file.
      - name: Sync dependencies
        run: uv sync --locked --no-group plugin

      - name: Download coverage data
        uses: actions/download-artifact@v4
        with:
          pattern: coverage-*
          path: cyxla
          merge-multiple: true

      # `--no-sync` keeps uv from syncing the plugin group back in.
      - name: Combine coverage data
        run: uv run --no-sync coverage combine

      - name: Coverage report
        run: uv run --no-sync coverage report

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Sync dependencies
        run: uv sync --locked --no-group plugin

      # `--no-sync` keeps uv from syncing the plugin group back in.
      - name: Lint
        run: uv run --no-sync ruff check

      - name: Check formatting
        run: uv run --no-sync ruff format --check

      - name: Type check
        run: uv run --no-sync ty check

  wheels:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      # The action runs from the repository root, so the paths below start there.
      - name: Build wheels
        uses: pypa/cibuildwheel@v3.1.4
        with:
          package-dir: cyxla
          output-dir: wheelhouse
        env:
          CIBW_BUILD: "cp311-* cp312-* cp313-* cp314-*"
          CIBW_SKIP: "*-musllinux_* *-win32 *-win_arm64"
          CIBW_TEST_COMMAND: python -c "import cyxla; print(cyxla.ABI_VERSION)"

      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: wheelhouse/*.whl

  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Build sdist
        run: uv build --no-config --sdist -o dist

      - name: Upload sdist
        uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: cyxla/dist/*.tar.gz

  publish:
    needs: [test, lint, wheels, sdist]
    if: startsWith(github.ref, 'refs/tags/cyxla-v')
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - name: Download wheels
        uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true

      - name: Download sdist
        uses: actions/download-artifact@v4
        with:
          name: sdist
          path: dist
          merge-multiple: true

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
